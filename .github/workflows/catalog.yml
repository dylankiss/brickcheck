# Refreshes the set catalog from Rebrickable's CSV dump every week. As a side
# effect this keeps a free Supabase project from being paused for inactivity.
name: Refresh set catalog

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import-catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
