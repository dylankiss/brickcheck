# Refreshes the set catalog from Rebrickable's CSV dump twice a week. As a side
# effect this keeps a free Supabase project from being paused after 7 idle days
# (twice a week leaves margin for delayed scheduled runs). GitHub disables
# schedules after 60 days without repository activity; re-enable it in Actions.
name: Refresh set catalog

on:
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: the Supabase secret key is in scope for the next step,
      # and this job needs no binaries that npm would download in a postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run import-catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
